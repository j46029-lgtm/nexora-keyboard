name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "nexa-shift-$TAG.apk"
          gh release upload "$TAG" "nexa-shift-$TAG.apk" --clobber --repo "${{ github.repository }}"
